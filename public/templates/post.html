<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{title}}</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #fafaf9;
      color: #1c1917;
    }

    .fade {
      opacity: 0;
      transform: translateY(30px) scale(.98);
      transition: all .7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .fade.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .glass {
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    html {
      scroll-behavior: smooth;
    }

    /* scroll invisível */
    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    html {
      scrollbar-width: none;
    }
  </style>
</head>

<body>

  <!-- VOLTAR -->
  <script>
    const BASE = location.hostname.includes('github.io')
      ? '/caminho-da-quaresma/'
      : '/';
  </script>

  <button onclick="
if (history.length > 1) {
  history.back();
} else {
  location.href = BASE;
}
" class="fixed top-4 left-4 z-50 glass px-4 py-2 rounded-full text-sm text-stone-600 hover:text-black shadow-sm hover:scale-105 transition">
    ← Voltar
  </button>

  <!-- IMAGEM -->
  <section class="w-full h-[40vh] md:h-[50vh] overflow-hidden">
    <img src="{{image}}" class="w-full h-full object-cover">
  </section>

  <!-- HEADER -->
  <section class="max-w-3xl mx-auto px-6 py-10">

    <h1 class="text-3xl md:text-5xl font-bold text-stone-900 fade">
      {{title}}
    </h1>

    <p class="text-stone-500 mt-4 text-lg fade">
      {{subtitle}}
    </p>

  </section>

  <!-- CONTEÚDO -->
  <main class="max-w-3xl mx-auto px-6 py-12 space-y-10">

    {{content}}

    {{tips}}

  </main>

  <footer class="text-center py-10 text-stone-400 text-sm">
    Caminho da Fé ✝️
  </footer>

  <script>
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('show');
      });
    });

    document.querySelectorAll('.fade').forEach(el => observer.observe(el));
  </script>

</body>

</html>
